description: >-
  AIG publishes no API plans, tiers or rate card of any kind. The 2026-08-30 pass walked
  www.aig.com's full sitemap (361 URLs) and probed AIG's live API gateway and developer-portal
  hosts; there is no pricing page for API access, no signup, and no self-service tier. Access to
  https://commercial.api.aig.com is provisioned to appointed brokers, producers and clients under
  distribution and technology agreements, and the commercial relationship is priced on insurance
  premium rather than on API consumption.
