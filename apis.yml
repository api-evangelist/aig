  - aid: aig:aig-commercial-api-gateway
    name: AIG Commercial API Gateway
    tags:
    - Insurance
    - Broker
    - Producer Management
    - OAuth
    - Gateway
    humanURL: https://www.aig.com/home/app-and-web-portal
    baseURL: https://commercial.api.aig.com
    description: AIG's production API gateway for its commercial broker and producer applications, discovered from the publicly served runtime configuration of the AIG Producer Management Portal.
      The host is live and answers on real routes (/pmp-gateway/c2a/pmp-ext-gtw-api and /pmp-usrmgmt-gateway/c2a/pmp-ext-usermgmt-gtw-api) but every anonymous call is rejected by an Okta-backed
      "Protect Proxy" policy. AIG publishes no contract, reference, or documentation for it; the auth model, scopes and error envelopes recorded here were established by probing the gateway and by
      reading AIG's own anonymously-served OAuth/OIDC discovery documents.
    properties:
    - url: authentication/aig-authentication.yml
      type: Authentication
    - url: scopes/aig-scopes.yml
      type: OAuthScopes
